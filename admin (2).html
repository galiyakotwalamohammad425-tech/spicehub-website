<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpiceHub | Admin Dashboard</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #f4f1eb;
            color: #171717;
        }

        /* HEADER */

        .admin-header {
            background: #0d0d0d;
            color: white;
            padding: 22px 6%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: "DM Serif Display", serif;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .logo span {
            color: #d6a354;
        }

        .live {
            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 12px;
            color: #aaa;
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background: #31b56b;
            border-radius: 50%;
            box-shadow: 0 0 10px #31b56b;
        }

        /* MAIN */

        .dashboard {
            max-width: 1300px;
            margin: auto;
            padding: 50px 5%;
        }

        .dashboard-title {
            margin-bottom: 35px;
        }

        .dashboard-title p {
            color: #a8732d;
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .dashboard-title h1 {
            font-family: "DM Serif Display", serif;
            font-size: 52px;
            font-weight: 400;
            margin-top: 5px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 25px;

            border: 1px solid #e4ded2;

            box-shadow:
                0 8px 25px rgba(0,0,0,.04);
        }

        .stat-card span {
            color: #888;
            font-size: 12px;
        }

        .stat-card h2 {
            font-size: 35px;
            margin-top: 5px;
            font-weight: 500;
        }

        /* BOOKINGS */

        .booking-box {
            background: white;
            border: 1px solid #e4ded2;
            overflow-x: auto;
        }

        .booking-header {
            padding: 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #eee;
        }

        .booking-header h2 {
            font-family: "DM Serif Display", serif;
            font-size: 28px;
            font-weight: 400;
        }

        .refresh-btn {
            border: 1px solid #b78a45;
            background: transparent;
            padding: 9px 16px;

            cursor: pointer;

            font-family: "Poppins", sans-serif;
            font-size: 12px;
        }

        .refresh-btn:hover {
            background: #b78a45;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #faf8f4;

            text-align: left;

            padding: 15px;

            font-size: 11px;

            color: #777;

            letter-spacing: 1px;
        }

        td {
            padding: 16px 15px;

            border-top: 1px solid #eee;

            font-size: 13px;
        }

        .customer-name {
            font-weight: 600;
        }

        .phone {
            color: #777;
        }

        /* STATUS */

        .status {
            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            font-size: 10px;

            font-weight: 600;
        }

        .pending {
            background: #fff3cd;
            color: #8a6500;
        }

        .confirmed {
            background: #e8f5e9;
            color: #287b3c;
        }

        .rejected {
            background: #ffebee;
            color: #c62828;
        }

        /* ACTIONS */

        .actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            border: none;

            padding: 7px 10px;

            cursor: pointer;

            font-family: "Poppins", sans-serif;

            font-size: 10px;
        }

        .confirm-btn {
            background: #e8f5e9;
            color: #287b3c;
        }

        .reject-btn {
            background: #ffebee;
            color: #c62828;
        }

        .delete-btn {
            background: #eee;
            color: #555;
        }

        .action-btn:hover {
            opacity: .75;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            display: none;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .admin-header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 23px;
            }

            .dashboard {
                padding: 35px 4%;
            }

            .dashboard-title h1 {
                font-size: 40px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="admin-header">

    <div class="logo">
        <span>SPICE</span>HUB
        <small style="font-family:Poppins;font-size:10px;color:#888;">
            ADMIN
        </small>
    </div>

    <div class="live">

        <span class="live-dot"></span>

        LIVE DATABASE

    </div>

</header>


<!-- DASHBOARD -->

<main class="dashboard">


    <div class="dashboard-title">

        <p>RESTAURANT MANAGEMENT</p>

        <h1>Booking Dashboard</h1>

    </div>


    <!-- STATS -->

    <section class="stats">


        <div class="stat-card">

            <span>TOTAL BOOKINGS</span>

            <h2 id="totalBookings">
                0
            </h2>

        </div>


        <div class="stat-card">

            <span>PENDING</span>

            <h2 id="pendingBookings">
                0
            </h2>

        </div>


        <div class="stat-card">

            <span>CONFIRMED</span>

            <h2 id="confirmedBookings">
                0
            </h2>

        </div>


    </section>


    <!-- BOOKINGS -->

    <section class="booking-box">


        <div class="booking-header">

            <h2>Reservations</h2>

            <button
                class="refresh-btn"
                onclick="location.reload()"
            >
                ↻ Refresh
            </button>

        </div>


        <table>


            <thead>

                <tr>

                    <th>CUSTOMER</th>

                    <th>PHONE</th>

                    <th>DATE</th>

                    <th>TIME</th>

                    <th>GUESTS</th>

                    <th>OCCASION</th>

                    <th>STATUS</th>

                    <th>ACTIONS</th>

                </tr>

            </thead>


            <tbody id="bookingTable">

            </tbody>


        </table>


        <div
            class="empty"
            id="emptyMessage"
        >

            No bookings yet.

        </div>


    </section>


</main>



<!-- FIREBASE -->

<script type="module">


    import {
        initializeApp
    }

    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getDatabase,
        ref,
        onValue,
        update,
        remove
    }

    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /* FIREBASE CONFIG */

    const firebaseConfig = {

       apiKey: "AIzaSyDYpRwC21tnQ7hoywnIyAKSHaI67wy53WM",

        authDomain:
        "spicehub-d8128.firebaseapp.com",

        databaseURL:
        "https://spicehub-d8128-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId:
        "spicehub-d8128",

        storageBucket:
        "spicehub-d8128.firebasestorage.app",

        messagingSenderId:
        "816485802280",

        appId:
        "1:816485802280:web:44b190efd735b5c47d701d"

    };


    const app =
        initializeApp(firebaseConfig);


    const database =
        getDatabase(app);


    const bookingsRef =
        ref(database, "bookings");


    const table =
        document.getElementById("bookingTable");


    const emptyMessage =
        document.getElementById("emptyMessage");


    const total =
        document.getElementById("totalBookings");


    const pending =
        document.getElementById("pendingBookings");


    const confirmed =
        document.getElementById("confirmedBookings");


    /* LIVE BOOKINGS */

    onValue(
        bookingsRef,
        function(snapshot)
        {

            table.innerHTML = "";


            let totalCount = 0;

            let pendingCount = 0;

            let confirmedCount = 0;


            const data =
                snapshot.val();


            if (!data)
            {

                emptyMessage.style.display =
                    "block";

                total.textContent = "0";

                pending.textContent = "0";

                confirmed.textContent = "0";

                return;

            }


            emptyMessage.style.display =
                "none";


            Object.entries(data)
            .reverse()
            .forEach(
                ([id, booking]) =>
                {

                    totalCount++;


                    if (
                        booking.status ===
                        "pending"
                    )
                    {
                        pendingCount++;
                    }


                    if (
                        booking.status ===
                        "confirmed"
                    )
                    {
                        confirmedCount++;
                    }


                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            <span class="customer-name">
                                ${escapeHTML(booking.name || "-")}
                            </span>
                        </td>

                        <td>
                            <span class="phone">
                                ${escapeHTML(booking.phone || "-")}
                            </span>
                        </td>

                        <td>
                            ${escapeHTML(booking.date || "-")}
                        </td>

                        <td>
                            ${escapeHTML(booking.time || "-")}
                        </td>

                        <td>
                            ${escapeHTML(booking.guests || "-")}
                        </td>

                        <td>
                            ${escapeHTML(booking.occasion || "-")}
                        </td>

                        <td>

                            <span class="status ${getStatusClass(booking.status)}">

                                ${escapeHTML(
                                    booking.status || "pending"
                                )}

                            </span>

                        </td>

                        <td>

                            <div class="actions">

                                <button
                                    class="action-btn confirm-btn"
                                    onclick="changeStatus('${id}','confirmed')"
                                >
                                    ✓
                                </button>

                                <button
                                    class="action-btn reject-btn"
                                    onclick="changeStatus('${id}','rejected')"
                                >
                                    ✕
                                </button>

                                <button
                                    class="action-btn delete-btn"
                                    onclick="deleteBooking('${id}')"
                                >
                                    🗑
                                </button>

                            </div>

                        </td>

                    `;


                    table.appendChild(row);

                }
            );


            total.textContent =
                totalCount;


            pending.textContent =
                pendingCount;


            confirmed.textContent =
                confirmedCount;

        }
    );


    /* STATUS */

    window.changeStatus =
        async function(id, status)
        {

            try
            {

                await update(
                    ref(
                        database,
                        "bookings/" + id
                    ),
                    {
                        status: status
                    }
                );

            }

            catch(error)
            {

                console.error(error);

                alert(
                    "Could not update booking."
                );

            }

        };


    /* DELETE */

    window.deleteBooking =
        async function(id)
        {

            const confirmDelete =
                confirm(
                    "Delete this booking?"
                );


            if (!confirmDelete)
            {
                return;
            }


            try
            {

                await remove(
                    ref(
                        database,
                        "bookings/" + id
                    )
                );

            }

            catch(error)
            {

                console.error(error);

                alert(
                    "Could not delete booking."
                );

            }

        };


    /* SECURITY */

    function escapeHTML(value)
    {

        return String(value)

            .replaceAll("&", "&amp;")

            .replaceAll("<", "&lt;")

            .replaceAll(">", "&gt;")

            .replaceAll('"', "&quot;")

            .replaceAll("'", "&#039;");

    }


    function getStatusClass(status)
    {

        if (status === "confirmed")
            return "confirmed";

        if (status === "rejected")
            return "rejected";

        return "pending";

    }


</script>


</body>

</html>
